# Tests à chaque push et pull request.
name: Tests

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Scénario complet de l'interface
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Écran virtuel
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: E2E (faux Scryfall, aucune requête réseau réelle)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
